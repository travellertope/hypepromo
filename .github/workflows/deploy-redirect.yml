name: Deploy Redirect Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/redirect/**'
      - '.github/workflows/deploy-redirect.yml'

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/redirect

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Ensure Cloudflare Queue exists
        # 86400s is the max retention on the Workers free plan
        run: |
          npx wrangler queues info promoet-clicks >/dev/null 2>&1 \
            || npx wrangler queues create promoet-clicks --message-retention-period-secs 86400
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
